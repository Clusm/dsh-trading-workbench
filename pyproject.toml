[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data", "logs"]

[tool.ruff.lint]
# 第一阶段只启用能直接发现运行错误的规则；导入排序、复杂度和命名规则在
# 核心模块分批整理后再升级为强制检查，避免一次机械改写交易执行链。
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
