name: offline-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-offline-regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Static checks and risk profile lock
        run: python scripts/check_quality.py
      - name: Offline behavior regression
        env:
          EXECUTION_MODE: paper
          MTA_NO_PROXY: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python scripts/run_offline_regression.py
