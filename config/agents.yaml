agents:
  # 双通道：strategy_trader 执行策略信号；ai_trader 自主决策。
  # orchestrator 暂时保留兼容旧配置，后续由两个新 Agent 替换。
  - name: strategy_trader
    role: strategy_execution
    model: qwen3.7-flash
    temperature: 0.2
    max_tokens: 8000
    reasoning_effort: high
  - name: ai_trader
    role: discretionary_trader
    model: qwen3.7-max
    temperature: 0.3
    # 2026-09-05 实测降档：high+8000 在多轮工具调用后单次耗时冲到 124s，
    # 被网关 60s 上限截断返回 504，AI 通道整轮 no_trade。
    # 降为 medium+4000 以把峰值耗时压回超时线内；若供应商网关放宽可改回。
    max_tokens: 4000
    reasoning_effort: medium
  - name: market_agent
    role: crypto_market_intel
    model: qwen3.7-flash
    temperature: 0.1
    max_tokens: 2000
    reasoning_effort: low
  - name: macro_agent
    role: macro_intel
    model: qwen3.7-flash
    temperature: 0.1
    max_tokens: 2000
    reasoning_effort: low
  - name: onchain_agent
    role: web3_intel
    model: qwen3.7-flash
    temperature: 0.1
    max_tokens: 2000
    reasoning_effort: low
  - name: strategy_agent
    role: strategy_library
    model: none
  - name: risk_agent
    role: risk_guardian
    llm_optional: true
  - name: execution_agent
    role: exchange_execution
  - name: review_agent
    role: daily_review
    model: qwen3.7-flash
    temperature: 0.2
    max_tokens: 4000
    reasoning_effort: low
