app_name: multi-agent-trader
stage: phase3
log_level: INFO

paths:
  data_dir: data
  db_file: data/agent_trader.sqlite
  artifacts_dir: data/artifacts
  logs_dir: data/logs
  reviews_dir: data/reviews
  knowledge_dir: knowledge

# 稳定性机制与风险档分开配置。账户级风险守卫先审计，不改变当前交易行为。
stability:
  risk_guard_mode: audit_only
  # 以下均为运维时效阈值，不改变仓位、杠杆或止损风险档。
  startup_grace_seconds: 120
  fast_cycle_stale_seconds: 120
  protection_reconcile_stale_seconds: 120

database_backup:
  enabled: true
  directory: data/backups
  interval_hours: 24
  retry_hours: 1
  keep_days: 14

# USD-M私有账户流进入观察期：只落幂等收件箱，不更新账户镜像、不驱动订单。
exchange_stream:
  enabled: true
  observe_only: true
  keepalive_minutes: 30
  planned_reconnect_hours: 23
  reconnect_seconds: 5
  queue_size: 5000

# 账户镜像只做影子比较；Dashboard、快循环和决策仍读取Broker REST真值。
account_mirror:
  enabled: true
  shadow_only: true
  rest_reconcile_seconds: 60

# 订单事件状态机同样仅作影子审计，不接管Broker订单读写。
order_mirror:
  enabled: true
  shadow_only: true
  rest_reconcile_seconds: 60

exchange_safety_monitor:
  enabled: true
  observe_only: true

protection_order_mirror:
  enabled: true
  read_enabled: true
  rest_reconcile_seconds: 30

llm:
  provider: sensenova
  api_key_env: SENSENOVA_API_KEY
  base_url_env: SENSENOVA_BASE_URL
  model_env: SENSENOVA_MODEL
  default_model: deepseek-v4-flash
  default_base_url: https://token.sensenova.cn/v1
  mock: false
  temperature: 0.2
  max_tokens: 2000
  reasoning_effort: low
  timeout_seconds: 180
  # 主决策Agent跨多轮工具调用的总时限；到期安全降级为 no_trade。
  # 不改变模型、推理档、风险参数或既有平仓/保护路径。
  total_timeout_seconds: 240
  # 瞬时错误（504/429/5xx/网络异常）重试次数与退避间隔
  # 保留有限重试处理 429/5xx/网络异常；鉴权和参数类 4xx 不重试。
  max_retries: 3
  retry_backoff_seconds: 3.0

execution:
  default_mode: demo
  mode_env: EXECUTION_MODE
  # 非 paper 模式缺少凭证时拒绝启动，避免真实/纸面资金口径静默切换。
  allow_paper_fallback: false
  base_url_map:
    demo: https://demo-fapi.binance.com
    testnet: https://testnet.binancefuture.com
    live: https://fapi.binance.com
  api_key_env_map:
    demo: BINANCE_DEMO_API_KEY
    testnet: BINANCE_TESTNET_API_KEY
    live: BINANCE_LIVE_API_KEY
  api_secret_env_map:
    demo: BINANCE_DEMO_API_SECRET
    testnet: BINANCE_TESTNET_API_SECRET
    live: BINANCE_LIVE_API_SECRET

capital:
  # 测试模式（paper/demo/testnet）起始资金；实盘模式下仅作为会话权益的计量基准
  initial_equity: 500
  bankruptcy_threshold: 1.0
  reset_on_bankruptcy: true
  state_file: data/capital_state.json

review:
  # 每日自动复盘：UTC 指定时间后，慢循环检测到即自动生成昨日复盘报告
  auto: true
  time_utc: "00:05"
  # 复盘报告是否调用 LLM 生成总结段
  use_llm: true

channels:
  # 虚拟账本按总权益分配：策略 60% / AI 自决策 40%
  strategy_weight: 0.6
  ai_weight: 0.4
  state_file: data/channel_state.json
  # 每日重算与统计统一按 UTC 日切
  rebalance_time_utc: "00:00"
  daily_tz: UTC
  # 通道保证金上限 = 通道权益 * channel_max_margin_usage
  channel_max_margin_usage: 0.80
  # AI 自决策通道当日亏损熔断线（按 UTC 日，相对当日初始权益）
  ai_daily_loss_stop: 0.30
  # AI 单杠杆由 AI 自己选择：常规档 20x 封顶；强信心档（confidence>=阈值且带止损）最高 25x
  ai_max_leverage: 20
  ai_strong_max_leverage: 25
  # AI 决策单默认逐仓
  ai_default_margin_mode: ISOLATED
  # 所有新开仓必须同时设置初始止损与止盈
  require_initial_sl_tp: true

quotas:
  enabled: true
  hourly_short_target: 5
  daily_hourly_target: 3

signal_scanner:
  # 已验证策略的最小运行时已内置在 src/strategy_runtime，不依赖研究仓库路径。
  kline_limit: 300
  # 信号触发后 ticket 的有效期（按 K 线根数）
  ticket_valid_bars: 2
  # 策略单不再固定名义金额/杠杆：在区间内按策略账本风险预算自适应
  strategy_min_notional_usdt: 20
  strategy_max_notional_usdt: 120
  strategy_max_leverage: 20
  strategy_risk_per_trade: 0.02
  # 去重状态文件（记录已发射的 signal id，防止同一根 K 线重复触发）
  signal_state_file: data/signal_scanner_state.json
  # false=只在策略卡已经回测验证的 symbols 上生成可执行信号。
  # 通用跨品种模式保留给后续影子验证，不允许未经验证直接进入生产执行。
  universal_cards: false
  # 通用模式启用时按持久化游标轮转；5 个/轮可在 40 分钟内覆盖 20 币白名单。
  max_scan_symbols_per_cycle: 5

decision_cycle:
  interval_minutes: 10
  # 快循环：无 LLM，只处理挂单/保护单/台账对账（秒~十秒级）
  fast_interval_seconds: 30
  # AI 通道每轮行情查询预算（次）。orchestrator 占全系统 prompt token 的 95%，
  # 查询结果在 messages 里逐轮累积只增不减，这是最主要的成本闸门。
  # 2026-09-05 实测：预算 8 时 prompt 逐轮膨胀 6655→8666→13522 tok，
  # 单次耗时 7.5s→15.3s→33s→124s，最终突破网关 60s 上限返回 504，
  # AI 通道因此整轮降级 no_trade。降到 4 以把峰值压回超时线内。
  query_budget: 4

intel_cache:
  ttl_seconds: 3600

# Binance USD-M 行情接入层：不改变策略或风险档，只约束数据请求方式。
binance_market_data:
  # Binance USD-M 当前公开 REQUEST_WEIGHT 分钟额度；运行时仍以响应头为准。
  weight_limit_1m: 2400
  # 本项目最多主动使用25%，为执行对账及共享出口的未知流量保留余量。
  local_weight_budget_1m: 600
  background_defer_ratio: 0.75
  normal_defer_ratio: 0.90
  # futures/data 系列按交易所公开的 IP 5 分钟窗口治理；800 留出20%运维余量。
  data_endpoint_window_seconds: 300
  data_endpoint_budget_5m: 800
  websocket_first: true
  stream_all_core_symbols: true
  # 只订阅基础周期；1h/2h/4h/8h/1d由本地聚合，避免数百帧/秒。
  kline_intervals: [1m, 15m]

# 只读情报侧车：不持有交易密钥，不进入下单图，初始阶段仅展示和影子评估。
web3_intel:
  enabled: true
  shadow_only: true
  execution_weight: 0
  refresh_seconds: 300
  fresh_seconds: 600
  # BTC/ETH/SOL 每轮采集，其余白名单轮转，约 20 分钟覆盖一次全池。
  priority_count: 3
  rotation_count: 4
  # 真实钱包跟踪和 Token Audit 必须显式配置，空值表示 unknown/unconfigured。
  watched_wallets: []
  token_contracts: {}
  etherscan_api_key_env: ETHERSCAN_API_KEY
  liquidation_stream_enabled: true
  # 仅用于影子结果核算，不改变下单手续费、风险档或仓位。
  round_trip_fee_bps: 10
  slippage_bps: 4
  sample_retention_days: 90

symbol_universe:
  # 市场快照只做 regime 判断，不需要深扫 40 个币；AI 按需自己查询
  top_n: 20
  analyze_top: 10
  quote_asset: USDT

market_universe:
  # 动态扫描池：默认每 5 分钟快速池，每 60 分钟全量池
  #
  # core_symbols 是「我们会真正交易的品种」白名单，同时用作市场情报的采集源。
  # 必须逐个校验存在于币安 USDT 永续（/fapi/v1/exchangeInfo，status=TRADING）。
  #
  # 选品依据：按 24h 成交额从高到低取前 20（2026-09-02 快照）。
  # 用白名单而非「全市场按成交额 top N」的原因：币安上的美股/商品代币化合约
  # （SOXLUSDT 半导体ETF、XAGUSDT 白银、XAUUSDT 黄金、SKHYNIXUSDT、SNDKUSDT、SPCXUSDT 等）
  # 在美股时段成交额会冲进前十，但它们与加密交易无关、历史订单一次都没有。
  # 盲选会让约 60% 的采集预算和 prompt 字符浪费在永不交易的标的上，
  # 还会把 regime 判定带偏（用美股涨跌判断币圈趋势）。
  #
  # ZECUSDT 此前漏配，但它 24h 成交额 12.44 亿排第 4、历史成交 23 单，本次补入。
  core_symbols:
    - BTCUSDT
    - ETHUSDT
    - SOLUSDT
    - ZECUSDT
    - XRPUSDT
    - ARBUSDT
    - UNIUSDT
    - DOGEUSDT
    - BNBUSDT
    - NEARUSDT
    - SUIUSDT
    - FILUSDT
    - ADAUSDT
    - LINKUSDT
    - OPUSDT
    - TRXUSDT
    - AAVEUSDT
    - AVAXUSDT
    - LTCUSDT
    - DOTUSDT
  quick_core_top: 3
  quick_anomaly_top: 2
  full_top_n: 20
  full_anomaly_n: 5
  short_move_pct: 3.0
  full_scan_interval_minutes: 60
  state_file: data/market_universe_state.json
