profile: learning_adventurous
market: binance_futures_testnet

max_leverage: 20
max_margin_usage: 0.80
max_position_notional: 100000
max_open_positions: 8
max_risk_per_trade: 0.02
daily_loss_stop: 0.15
max_drawdown_from_peak: 0.30
allow_bare_position: true
stale_data_block_seconds: 60

# 强信心档：当 confidence >= 阈值且必须带止损时，允许更高杠杆/仓位
strong_confidence_threshold: 0.65
strong_max_leverage: 50
strong_max_margin_usage: 0.90
strong_max_position_notional: 200000
strong_max_risk_per_trade: 0.10
strong_min_risk_reward: 2.0

always_enforced:
  reduce_only_for_closing: true
  duplicate_order_block: true
  stale_data_block: true
  reconcile_before_reopen: true
